name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Ruff Lint and Format Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Offline Unit Tests
        env:
          WC_MOCK: "1"
        run: |
          pytest -m "not slow"

      - name: Run WeirdClauses Doctor
        run: |
          weirdclauses doctor
