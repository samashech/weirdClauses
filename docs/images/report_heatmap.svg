  <!-- Banner -->
  <rect x="24" y="58" width="802" height="30" fill="#fffbeb" stroke="#fcd34d" rx="4" />
  <text x="36" y="78" font-size="11" font-weight="600" fill="#92400e">DISCLAIMER: WeirdClauses is NOT legal advice. Always consult a qualified attorney.</text>

  <!-- Metric boxes -->
  <g transform="translate(24, 100)">
    <rect x="0" y="0" width="188" height="50" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
    <text x="12" y="20" font-size="10" fill="#64748b">SCORED CLAUSES</text>
    <text x="12" y="40" font-size="16" font-weight="700" fill="#2563eb">6 / 6 (100%)</text>

    <rect x="204" y="0" width="188" height="50" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
    <text x="216" y="20" font-size="10" fill="#64748b">KEY FACTS (RULE-BASED)</text>
    <text x="216" y="40" font-size="16" font-weight="700" fill="#10b981">7 Detected</text>

    <rect x="408" y="0" width="188" height="50" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
    <text x="420" y="20" font-size="10" fill="#64748b">MEAN SURPRISAL</text>
    <text x="420" y="40" font-size="16" font-weight="700" fill="#0f172a">10.85 bits</text>

    <rect x="612" y="0" width="190" height="50" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
    <text x="624" y="20" font-size="10" fill="#64748b">TOP ANOMALY SCORE</text>
    <text x="624" y="40" font-size="16" font-weight="700" fill="#ef4444">12.80 bits</text>
  </g>

  <!-- Clause Heatmap Preview -->
  <g transform="translate(24, 168)">
    <rect x="0" y="0" width="802" height="230" fill="#ffffff" stroke="#cbd5e1" rx="6" />
    <rect x="0" y="0" width="802" height="32" fill="#f8fafc" rx="6" />
    <text x="14" y="21" font-size="12" font-weight="700" fill="#991b1b">RANK #1 • 4. FELINE VISUAL OBSERVATION COVENANT</text>
    <text x="670" y="21" font-size="11" font-weight="600" fill="#2563eb">Score: 12.80 bits (+1.13 Z)</text>

    <!-- Simulated Tokens -->
    <text x="14" y="60" font-family="monospace" font-size="13" fill="#0f172a">
      <tspan fill="#0f172a">Tenant agrees to maintain a minimum of </tspan>
      <tspan fill="#ffffff" style="background:#ef4444; border-radius:3px;">two feline domestic animals</tspan>
      <tspan fill="#0f172a"> on premises and ensure </tspan>
    </text>
    <text x="14" y="85" font-family="monospace" font-size="13" fill="#0f172a">
      <tspan fill="#ffffff" style="background:#dc2626; border-radius:3px;">cats are visible through front bay windows</tspan>
      <tspan fill="#0f172a"> between the hours of </tspan>
      <tspan text-decoration="underline" fill="#2563eb">9:00 AM and 5:00 PM</tspan>
    </text>
    <text x="14" y="110" font-family="monospace" font-size="13" fill="#0f172a">
      <tspan fill="#0f172a">daily for architectural enhancement. A failure fee of </tspan>
      <tspan text-decoration="underline" fill="#2563eb" style="background:#f87171;">$75 per unobserved day</tspan>
      <tspan fill="#0f172a"> applies.</tspan>
    </text>

    <!-- Nearest Standard Box -->
    <rect x="14" y="140" width="774" height="70" fill="#f1f5f9" stroke="#cbd5e1" rx="4" />
    <text x="24" y="160" font-size="11" font-weight="700" fill="#334155">Nearest Standard Baseline Match (Similarity: 0.62):</text>
    <text x="24" y="178" font-size="11" fill="#64748b">"Refundable Pet Deposit: No pets shall be kept without Landlord's advance written consent and deposit..."</text>
    <text x="24" y="196" font-size="11" fill="#0284c7">Rule-Based Fact Attached: Notice Period (9:00 AM - 5:00 PM), Money Amount ($75)</text>
  </g>
