<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420" style="background:#ffffff; font-family:system-ui,-apple-system,sans-serif; border-radius:8px; border:1px solid #cbd5e1;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="850" height="45" fill="#f8fafc" rx="8" border-bottom="1px solid #cbd5e1" />
  <text x="24" y="28" font-size="16" font-weight="700" fill="#0f172a">WeirdClauses Anomaly Report</text>
